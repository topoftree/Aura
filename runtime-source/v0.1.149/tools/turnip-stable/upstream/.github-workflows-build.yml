# SPDX-License-Identifier: MIT
name: Build Mesa Turnip driver

on:
  push:
    branches: [main]
    tags:
      - 'mesa-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesa-turnip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate builder scripts
        run: |
          bash -n build.sh
          git diff --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build builder image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mesa-turnip-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Mesa Turnip packages
        env:
          MESA_TAG: ${{ startsWith(github.ref, 'refs/tags/mesa-') && github.ref_name || 'mesa-26.2.5' }}
          PACKAGE_NAME: Mesa-Turnip-AdrenoTools
          MAGISK_VULKAN_FILENAME: vulkan.adreno.so
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm \
            -e MESA_TAG="$MESA_TAG" \
            -e PACKAGE_NAME="$PACKAGE_NAME" \
            -e MAGISK_VULKAN_FILENAME="$MAGISK_VULKAN_FILENAME" \
            -v "$GITHUB_WORKSPACE/out:/out" \
            mesa-turnip-builder:latest

      - name: Show artifact checksums
        run: |
          cat out/SHA256SUMS.txt
          cat out/SHA512SUMS.txt

      - name: Upload driver package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mesa-Turnip-Android-Driver-Pack
          path: |
            out/*.zip
            out/SHA256SUMS.txt
            out/SHA512SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mesa-')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release-note extractor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Mesa-Turnip-Android-Driver-Pack
          path: release-assets

      - name: Generate filtered Turnip release notes
        run: scripts/extract-turnip-notes.sh "$GITHUB_REF_NAME" /tmp/mesa-turnip-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#mesa-}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mesa Turnip $release_version" \
            --notes-file /tmp/mesa-turnip-notes.md \
            release-assets/*
